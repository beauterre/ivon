<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>За Ивон</title>

  <style>
    :root {
      --paper: #f8f5ef;
      --ink: #292722;
      --muted: #716d64;
      --gold: #b89a58;
      --line: #d9d1c1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.7;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 80px 28px 100px;
    }

    header {
      text-align: center;
      margin-bottom: 70px;
    }

    .small {
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(3rem, 9vw, 5rem);
      font-weight: normal;
      letter-spacing: 0.02em;
      margin: 12px 0 6px;
    }

    .subtitle {
      color: var(--muted);
      font-style: italic;
      font-size: 1.1rem;
    }

    .ornament {
      text-align: center;
      color: var(--gold);
      font-size: 1.4rem;
      margin: 50px 0;
    }

    .entries {
      border-top: 1px solid var(--line);
    }

    .entry {
      display: block;
      color: inherit;
      text-decoration: none;
      padding: 28px 5px;
      border-bottom: 1px solid var(--line);
      transition:
        background-color 0.2s ease,
        padding-left 0.2s ease,
        padding-right 0.2s ease;
    }

    .entry:hover {
      background: rgba(184, 154, 88, 0.06);
      padding-left: 12px;
      padding-right: 12px;
    }

    .entry-number {
      color: var(--gold);
      font-family: Arial, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .entry-title {
      font-size: 1.45rem;
      margin: 5px 0 4px;
    }

    .entry-description {
      color: var(--muted);
      font-size: 0.98rem;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 70px;
    }

    @media (max-width: 600px) {
      main {
        padding: 55px 22px 70px;
      }

      header {
        margin-bottom: 50px;
      }
    }
  </style>
</head>

<body>

<main>

  <header>
    <div class="small">За теб</div>

    <h1>Ивон</h1>

    <div class="subtitle">
      Малки истории, спомени и тайни.
    </div>
  </header>


  <div class="ornament">✦</div>


  <!--
    Добавяй нови неща тук.

    Копирай един от блоковете .entry и промени:
      1. href
      2. номера
      3. заглавието
      4. описанието

    Например:

    <a class="entry" href="s/another-story.html">
      <div class="entry-number">03</div>
      <div class="entry-title">Ново заглавие</div>
      <div class="entry-description">
        Кратко описание на историята.
      </div>
    </a>
  -->


  <section class="entries">

    <a class="entry" href="s/little-secret.html">
      <div class="entry-number">01</div>

      <div class="entry-title">
        Една малка тайна
      </div>

      <div class="entry-description">
        Историята на името Ивон и подаръка, който изглежда като сребро,
        но крие нещо повече.
      </div>
    </a>


    <!--
    Пример за следваща страница:

    <a class="entry" href="s/another-story.html">
      <div class="entry-number">02</div>

      <div class="entry-title">
        Заглавие
      </div>

      <div class="entry-description">
        Кратко описание.
      </div>
    </a>
    -->

  </section>


  <div class="ornament">✦</div>


  <footer>
    Направено за Ивон
  </footer>

</main>

</body>
</html>
